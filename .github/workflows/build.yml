name: Build for release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # default-features: [true, false]
        os:
          - image: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
            binary-name: grafbabe
            compress-command: "tar -czvf"
            asset-extension: "tgz"
          - image: "macos-latest"
            target: "aarch64-apple-darwin"
            binary-name: grafbabe
            compress-command: "tar -czvf"
            asset-extension: "tgz"
          - image: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            binary-name: grafbabe.exe
            compress-command: "7z a -tzip"
            asset-extension: "zip"
    name: Build ${{ matrix.os.target }}
    runs-on: ${{ matrix.os.image }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95
      - name: Build
        run: cargo build --release --locked
      - name: Compress
        run: |
          cd target/release
          ${{ matrix.os.compress-command }} "grafbabe.${{ matrix.os.target }}.${{ matrix.os.asset-extension }}" ${{ matrix.os.binary-name }}
      - name: Upload asset to release
        if: github.event.release
        uses: shogo82148/actions-upload-release-asset@d0cb37bb764791e72e64e643cd7056f74f1e77d7
        with:
          asset_path: target/release/*.${{ matrix.os.asset-extension }}
          asset_content_type: application/octet-stream
          upload_url: ${{ github.event.release.upload_url }}
