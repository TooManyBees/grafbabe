name: Build for release

on:
  release: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # default-features: [true, false]
        os:
          - image: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
            compress-command: "tar -czvf"
            artifact-name: "grafbabe"
            asset-extension: ".linux.tgz"
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os.image }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
      - name: Install rust toolchain
        id: rust-toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.97.1
          target: ${{ matrix.target }}
          override: true
      - name: Build
        run: cargo build --release --locked
      - name: Compress
        run: |
          cd target/release
          ${{ matrix.compress-command }} ${{ matrix.artifact-name }}${{ matrix.asset-extension }} ${{ matrix.artifact-name }}
      - name: Upload asset to release
        if: github.event.release
        uses: shogo82148/actions-upload-release-asset@8dbaa4469aa7256e70624d72f2567fac8f5341b3
        with:
          asset_path: target/release/${{ matrix.asset-name }}
          asset_name: ${{ matrix.asset-name }}
          asset_content_type: application/octet-stream
          upload_url: ${{ github.event.release.upload_url }}
